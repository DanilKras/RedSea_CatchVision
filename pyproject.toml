[project]
name = "redsea-catchvision"
version = "0.1.0"
description = "Species ID, metric sizing, and field robustness benchmark for Red Sea reef fisheries"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "duckdb>=1.1.3",
    "fastapi>=0.162.4",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "mlflow>=3.18.0",
    "numpy>=1.26.4,<2.2",
    "open-clip-torch>=2.29.0",
    "opencv-python>=4.10.0.84",
    "pandas>=2.2.3",
    "pillow>=11.0.0",
    "plotly>=5.24.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.33",
    "scikit-image>=0.24.0",
    "scipy>=1.14.0",
    "streamlit>=1.40.0",
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "transformers>=4.51.0",
    "typer>=0.15.0",
    "ultralytics>=8.3.50",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "pytest>=8.3.4",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/catchvision"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]

[project.scripts]
catchvision = "catchvision.cli:app"
