name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12 and dependencies
        run: uv sync --frozen

      - name: Lint with Ruff
        run: uv run ruff check src/ app/ scripts/ tests/

      - name: Run CPU unit tests
        run: uv run pytest -v

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build lightweight UI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: app/Dockerfile
          push: false